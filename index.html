
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adarsh Games</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101c35, #174b54);
  color: white;
  text-align: center;
  min-height: 100vh;
}

header {
  padding: 35px 15px 20px;
}

header h1 {
  font-size: 38px;
  margin: 10px;
  color: #ffdf50;
}

header p {
  color: #d7e8ed;
  font-size: 16px;
}

.games {
  max-width: 500px;
  margin: 20px auto;
  padding: 15px;
}

.game-card {
  background: #ffffff16;
  border: 1px solid #ffffff35;
  border-radius: 16px;
  padding: 20px;
  margin: 18px 0;
}

.game-card h2 {
  margin: 5px 0 10px;
}

.game-card p {
  color: #d8e5e9;
  font-size: 14px;
}

.game-btn {
  display: block;
  color: white;
  text-decoration: none;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.game-btn:active {
  transform: scale(0.97);
}

.guess {
  background: #7746b9;
}

.racing {
  background: #d64b35;
}

.cricket {
  background: #1876c9;
}

#musicBtn {
  position: fixed;
  right: 15px;
  bottom: 15px;
  padding: 14px 18px;
  border: 2px solid white;
  border-radius: 12px;
  background: #ffbf00;
  color: #222;
  font-size: 15px;
  font-weight: bold;
  z-index: 999;
}

#musicBtn:active {
  transform: scale(0.95);
}

footer {
  padding: 25px 10px 85px;
  color: #c8d9dd;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🎮 Adarsh Games</h1>
  <p>Welcome to My Gaming World!</p>
  <p>Play Games • Have Fun • Enjoy!</p>
</header>

<main class="games">

  <div class="game-card">
    <h2>🧠 Guess Game</h2>
    <p>Number Guessing Challenge</p>
    <a class="game-btn guess" href="guess.html">
      Play Guess Game
    </a>
  </div>

  <div class="game-card">
    <h2>🏎️ Car Racing</h2>
    <p>Drive your car and avoid obstacles!</p>
    <a class="game-btn racing" href="racing.html">
      Play Racing Game
    </a>
  </div>

  <div class="game-card">
    <h2>🏏 Cricket Game</h2>
    <p>Play cricket and score runs!</p>
    <a class="game-btn cricket" href="cricket.html">
      Play Cricket
    </a>
  </div>

</main>

<footer>
  <p>© 2026 Adarsh Games</p>
  <p>Made with ❤️</p>
</footer>

<button id="musicBtn">🎵 Music: OFF</button>

<script>
let audio = null;
let musicTimer = null;
let musicPlaying = false;

// Adventure melody
const melody = [
  392, 440, 523, 587,
  523, 440, 392, 330,
  392, 523, 587, 659,
  587, 523, 440, 392
];

// Bass notes
const bass = [
  131, 131, 147, 147,
  110, 110, 131, 131,
  98, 98, 131, 131,
  110, 110, 147, 147
];

const beat = 0.32;

function playNote(freq, start, duration, volume, type) {
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(freq, start);

  gain.gain.setValueAtTime(0.001, start);
  gain.gain.exponentialRampToValueAtTime(
    volume, start + 0.04
  );
  gain.gain.exponentialRampToValueAtTime(
    0.001, start + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start(start);
  oscillator.stop(start + duration + 0.02);
}

function playAdventureMusic() {
  if (!musicPlaying || !audio) return;

  const start = audio.currentTime + 0.05;

  for (let i = 0; i < melody.length; i++) {
    const time = start + i * beat;

    // Main adventure melody
    playNote(
      melody[i],
      time,
      0.26,
      0.045,
      "triangle"
    );

    // Low background bass
    if (i % 2 === 0) {
      playNote(
        bass[i],
        time,
        0.48,
        0.035,
        "sine"
      );
    }
  }

  // Repeat the music
  musicTimer = setTimeout(
    playAdventureMusic,
    melody.length * beat * 1000
  );
}

const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", async function() {
  if (!musicPlaying) {
    try {
      audio = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      await audio.resume();

      musicPlaying = true;
      musicBtn.innerText = "🎵 Music: ON";
      playAdventureMusic();

    } catch (error) {
      musicPlaying = false;
      musicBtn.innerText = "Music unavailable";
    }

  } else {
    musicPlaying = false;

    clearTimeout(musicTimer);

    if (audio) {
      await audio.close();
      audio = null;
    }

    musicBtn.innerText = "🎵 Music: OFF";
  }
});
</script>

</body>
</html>
