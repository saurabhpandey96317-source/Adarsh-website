
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adarsh Car Racing 3.0</title>

<style>
body {
  margin: 0;
  background: #151515;
  color: white;
  text-align: center;
  font-family: Arial;
}
h2 { color: yellow; }

.stats {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  font-size: 16px;
}

#game {
  width: 300px;
  height: 450px;
  background: #555;
  margin: auto;
  position: relative;
  overflow: hidden;
  border-left: 7px solid white;
  border-right: 7px solid white;
}

.line {
  position: absolute;
  width: 7px;
  height: 60px;
  background: white;
  left: 146px;
}

#player {
  position: absolute;
  bottom: 15px;
  left: 125px;
  font-size: 40px;
  z-index: 2;
}

.enemy {
  position: absolute;
  font-size: 40px;
  top: -50px;
}

button {
  padding: 12px 17px;
  margin: 5px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: orange;
  font-weight: bold;
}

#nitro {
  background: #087ff5;
  color: white;
}

#soundBtn {
  background: #159447;
  color: white;
}

#message { color: yellow; }

#cars button {
  background: #333;
  color: white;
  border: 2px solid orange;
}

#cars button.selected {
  background: orange;
  color: black;
}
</style>
</head>

<body>

<h2>🏎️ ADARSH CAR RACING 3.0</h2>

<div class="stats">
  <span>🏆 Score: <b id="score">0</b></span>
  <span>🥇 Best: <b id="best">0</b></span>
  <span>❤️ <b id="lives">3</b></span>
</div>

<h3>🚘 Choose Your Car</h3>

<div id="cars">
  <button class="selected" onclick="chooseCar('🏎️',this)">🏎️</button>
  <button onclick="chooseCar('🚕',this)">🚕</button>
  <button onclick="chooseCar('🚓',this)">🚓</button>
  <button onclick="chooseCar('🚑',this)">🚑</button>
</div>

<br>

<div id="game">
  <div class="line" style="top:0px"></div>
  <div class="line" style="top:150px"></div>
  <div class="line" style="top:300px"></div>
  <div id="player">🏎️</div>
</div>

<h3 id="message">अपनी कार चुनो और Race शुरू करो!</h3>

<button onclick="move(-1)">⬅️ Left</button>
<button onclick="move(1)">Right ➡️</button>
<br>

<button onclick="startGame()">▶️ Start / Restart</button>
<button id="nitro"
onpointerdown="useNitro()"
onpointerup="stopNitro()"
onpointerleave="stopNitro()"
onpointercancel="stopNitro()">⚡ NITRO</button>

<br>
<button id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button>

<script>
const player = document.getElementById("player");
const game = document.getElementById("game");

let lane = 1;
let score = 0;
let lives = 3;
let running = false;
let enemies = [];
let speed = 4;
let timer;
let enemyTimer;

let car = "🏎️";
let nitroOn = false;
let nitroTimer = 0;
let soundOn = true;

let best = 0;
try {
  best = Number(localStorage.getItem("adarshBest")) || 0;
} catch(e) {}

document.getElementById("best").innerText = best;

// CAR SELECT
function chooseCar(value, button) {
  if (running) {
    message.innerText = "पहले Race खत्म करो!";
    return;
  }

  car = value;
  player.innerText = car;

  document.querySelectorAll("#cars button")
    .forEach(b => b.classList.remove("selected"));

  button.classList.add("selected");
}

// SOUND
let audio = null;
let engineOsc = null;
let engineGain = null;

function initAudio() {
  if (!soundOn) return false;

  try {
    if (!audio) {
      const AudioClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioClass) return false;
      audio = new AudioClass();
    }

    if (audio.state === "suspended") audio.resume();
    return true;
  } catch(e) {
    return false;
  }
}

function playSound(freq, duration, volume, type) {
  if (!soundOn || !initAudio()) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type || "sine";
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001, audio.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime + duration);
}

function startEngine() {
  if (!soundOn || !initAudio()) return;

  stopEngine();

  engineOsc = audio.createOscillator();
  engineGain = audio.createGain();

  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 65;
  engineGain.gain.value = 0.025;

  engineOsc.connect(engineGain);
  engineGain.connect(audio.destination);
  engineOsc.start();
}

function stopEngine() {
  if (engineOsc) {
    try { engineOsc.stop(); } catch(e) {}
    engineOsc.disconnect();
    engineGain.disconnect();
    engineOsc = null;
    engineGain = null;
  }
}

function toggleSound() {
  soundOn = !soundOn;

  document.getElementById("soundBtn").innerText =
    soundOn ? "🔊 Sound ON" : "🔇 Sound OFF";

  if (soundOn && running) startEngine();
  if (!soundOn) stopEngine();
}

// MOVEMENT
function move(direction) {
  if (!running) return;

  lane += direction;
  lane = Math.max(0, Math.min(2, lane));

  player.style.left = (25 + lane * 100) + "px";
  playSound(300, 0.07, 0.04);
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
});

// START
function startGame() {
  clearInterval(timer);
  clearInterval(enemyTimer);

  enemies.forEach(e => e.remove());
  enemies = [];

  lane = 1;
  score = 0;
  lives = 3;
  speed = 4;
  running = true;
  nitroOn = false;

  player.innerText = car;
  player.style.left = "125px";

  document.getElementById("score").innerText = 0;
  document.getElementById("lives").innerText = 3;

  message.innerText = "🏁 Race शुरू!";

  startEngine();

  timer = setInterval(updateGame, 30);
  enemyTimer = setInterval(createEnemy, 1100);
}

// ENEMIES
function createEnemy() {
  if (!running) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const cars = ["🚙", "🚕", "🚗"];
  enemy.innerText = cars[Math.floor(Math.random() * cars.length)];

  const enemyLane = Math.floor(Math.random() * 3);
  enemy.dataset.lane = enemyLane;
  enemy.style.left = (25 + enemyLane * 100) + "px";

  game.appendChild(enemy);
  enemies.push(enemy);
}

// NITRO
function useNitro() {
  if (!running || nitroOn) return;

  nitroOn = true;
  nitroTimer = 0;

  playSound(850, 0.4, 0.12, "sawtooth");
  message.innerText = "⚡ NITRO BOOST!";

  if (engineOsc && soundOn) {
    engineOsc.frequency.value = 120;
  }
}

function stopNitro() {
  nitroOn = false;

  if (engineOsc && soundOn) {
    engineOsc.frequency.value = 65;
  }
}

// GAME LOOP
function updateGame() {
  let currentSpeed = speed;

  if (nitroOn) {
    currentSpeed = speed * 2;
    nitroTimer++;

    if (nitroTimer > 100) {
      nitroOn = false;
      if (engineOsc && soundOn) {
        engineOsc.frequency.value = 65;
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const y = enemy.offsetTop + currentSpeed;

    enemy.style.top = y + "px";

    const playerY = player.offsetTop;

    if (
      y + 40 > playerY &&
      y < playerY + 40 &&
      Number(enemy.dataset.lane) === lane
    ) {
      enemy.remove();
      enemies.splice(i, 1);
      loseLife();

      if (!running) return;
      continue;
    }

    if (y > 450) {
      enemy.remove();
      enemies.splice(i, 1);

      score++;
      document.getElementById("score").innerText = score;

      playSound(650, 0.12, 0.07);

      if (score > best) {
        best = score;
        document.getElementById("best").innerText = best;

        try {
          localStorage.setItem("adarshBest", best);
        } catch(e) {}
      }

      if (score % 5 === 0) speed += 0.5;
    }
  }
}

// LIFE
function loseLife() {
  lives--;
  document.getElementById("lives").innerText = lives;

  playSound(90, 0.5, 0.2, "sawtooth");

  if (lives <= 0) {
    endGame();
  } else {
    message.innerText = "💥 टक्कर! " + lives + " Lives बची हैं";
  }
}

// GAME OVER
function endGame() {
  running = false;
  nitroOn = false;

  clearInterval(timer);
  clearInterval(enemyTimer);

  stopEngine();

  message.innerText =
    "💀 GAME OVER! Final Score: " + score;
}
</script>

</body>
</html>
