
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adarsh Car Racing</title>

<style>
body {
  margin: 0;
  background: #222;
  color: white;
  text-align: center;
  font-family: Arial;
}

h2 {
  color: yellow;
}

#game {
  width: 300px;
  height: 450px;
  background: #555;
  margin: auto;
  position: relative;
  overflow: hidden;
  border-left: 7px solid white;
  border-right: 7px solid white;
}

.line {
  position: absolute;
  width: 8px;
  height: 60px;
  background: white;
  left: 146px;
}

#player {
  position: absolute;
  bottom: 15px;
  left: 125px;
  font-size: 40px;
}

.enemy {
  position: absolute;
  font-size: 40px;
  top: -50px;
}

button {
  padding: 14px 20px;
  margin: 6px;
  font-size: 17px;
  border: none;
  border-radius: 10px;
  background: orange;
  font-weight: bold;
}

#message {
  color: yellow;
}

#soundBtn {
  background: #20a65a;
  color: white;
}
</style>
</head>

<body>

<h2>🏎️ Adarsh Car Racing</h2>

<h3>Score: <span id="score">0</span></h3>

<div id="game">
  <div class="line" style="top:0px"></div>
  <div class="line" style="top:150px"></div>
  <div class="line" style="top:300px"></div>
  <div id="player">🏎️</div>
</div>

<h3 id="message">Race शुरू करो!</h3>

<button onclick="move(-1)">⬅️ Left</button>
<button onclick="move(1)">Right ➡️</button>
<br>

<button onclick="startGame()">Start / Restart</button>
<button id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button>

<script>
let player = document.getElementById("player");
let game = document.getElementById("game");
let scoreBox = document.getElementById("score");
let message = document.getElementById("message");
let soundBtn = document.getElementById("soundBtn");

let lane = 1;
let score = 0;
let running = false;
let enemies = [];
let speed = 4;
let timer;
let lineTimer;

let audio = null;
let engineOsc = null;
let engineGain = null;
let soundOn = true;

// Start audio after a user action
function initAudio() {
  if (!soundOn) return false;

  if (!audio) {
    const AudioClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioClass) {
      message.innerText = "Audio supported नहीं है";
      return false;
    }

    audio = new AudioClass();
  }

  if (audio.state === "suspended") {
    audio.resume();
  }

  return true;
}

// Play a short sound
function playSound(freq, duration, volume, type) {
  if (!soundOn || !initAudio()) return;

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = type || "sine";
  oscillator.frequency.setValueAtTime(
    freq, audio.currentTime
  );

  gain.gain.setValueAtTime(
    volume, audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start();
  oscillator.stop(audio.currentTime + duration);
}

// Engine sound
function startEngine() {
  if (!soundOn || !initAudio()) return;

  stopEngine();

  engineOsc = audio.createOscillator();
  engineGain = audio.createGain();

  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 65;
  engineGain.gain.value = 0.025;

  engineOsc.connect(engineGain);
  engineGain.connect(audio.destination);

  engineOsc.start();
}

function stopEngine() {
  if (engineOsc) {
    try {
      engineOsc.stop();
    } catch (e) {}

    engineOsc.disconnect();
    engineGain.disconnect();

    engineOsc = null;
    engineGain = null;
  }
}

// Crash sound
function crashSound() {
  if (!soundOn || !initAudio()) return;

  playSound(90, 0.5, 0.25, "sawtooth");

  setTimeout(() => {
    playSound(45, 0.35, 0.2, "square");
  }, 100);
}

// Score sound
function scoreSound() {
  playSound(650, 0.12, 0.08, "sine");
}

function toggleSound() {
  soundOn = !soundOn;

  if (soundOn) {
    soundBtn.innerText = "🔊 Sound ON";

    if (running) startEngine();
    else initAudio();

  } else {
    soundBtn.innerText = "🔇 Sound OFF";
    stopEngine();
  }
}

function move(direction) {
  if (!running) return;

  const oldLane = lane;

  lane += direction;

  if (lane < 0) lane = 0;
  if (lane > 2) lane = 2;

  if (oldLane !== lane) {
    player.style.left = (25 + lane * 100) + "px";
    playSound(300, 0.07, 0.04, "sine");
  }
}

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
});

function startGame() {
  clearInterval(timer);
  clearInterval(lineTimer);

  enemies.forEach(e => e.remove());
  enemies = [];

  lane = 1;
  score = 0;
  speed = 4;
  running = true;

  player.style.left = "125px";
  scoreBox.innerText = score;
  message.innerText = "🏁 Race शुरू!";

  startEngine();

  timer = setInterval(updateGame, 30);
  lineTimer = setInterval(createEnemy, 1100);
}

function createEnemy() {
  if (!running) return;

  let enemy = document.createElement("div");
  enemy.className = "enemy";
  enemy.innerText = "🚙";

  let enemyLane = Math.floor(Math.random() * 3);

  enemy.dataset.lane = enemyLane;
  enemy.style.left = (25 + enemyLane * 100) + "px";

  game.appendChild(enemy);
  enemies.push(enemy);
}

function updateGame() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];

    let y = enemy.offsetTop + speed;
    enemy.style.top = y + "px";

    let playerY = player.offsetTop;

    if (
      y + 40 > playerY &&
      y < playerY + 40 &&
      Number(enemy.dataset.lane) === lane
    ) {
      endGame();
      return;
    }

    if (y > 450) {
      enemy.remove();
      enemies.splice(i, 1);

      score++;
      scoreBox.innerText = score;

      scoreSound();

      if (score % 5 === 0) {
        speed += 0.5;
      }
    }
  }
}

function endGame() {
  if (!running) return;

  running = false;

  clearInterval(timer);
  clearInterval(lineTimer);

  stopEngine();
  crashSound();

  message.innerText = "💥 GAME OVER! Score: " + score;
}
</script>

</body>
</html>
