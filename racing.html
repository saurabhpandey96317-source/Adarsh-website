<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adarsh Car Racing</title><style>body {  margin: 0;  background: #222;  color: white;  text-align: center;  font-family: Arial;}h2 { color: yellow; }#game {  width: 300px;  height: 450px;  background: #555;  margin: auto;  position: relative;  overflow: hidden;  border-left: 7px solid white;  border-right: 7px solid white;}.line {  position: absolute;  width: 8px;  height: 60px;  background: white;  left: 146px;}#player {  position: absolute;  bottom: 15px;  left: 125px;  font-size: 40px;}.enemy {  position: absolute;  font-size: 40px;  top: -50px;}button {  padding: 14px 25px;  margin: 8px;  font-size: 20px;  border: none;  border-radius: 10px;  background: orange;}#message { color: yellow; }</style></head><body><h2>🏎️ Adarsh Car Racing</h2><h3>Score: <span id="score">0</span></h3><div id="game">  <div class="line" style="top:0px"></div>  <div class="line" style="top:150px"></div>  <div class="line" style="top:300px"></div>  <div id="player">🏎️</div></div><h3 id="message">Race शुरू करो!</h3><button onclick="move(-1)">⬅️ Left</button><button onclick="move(1)">Right ➡️</button><br><button onclick="startGame()">Start / Restart</button><script>let player = document.getElementById("player");let game = document.getElementById("game");let scoreBox = document.getElementById("score");let message = document.getElementById("message");let lane = 1;let score = 0;let running = false;let enemies = [];let speed = 4;let timer;let lineTimer;function move(direction) {  if (!running) return;  lane += direction;  if (lane < 0) lane = 0;  if (lane > 2) lane = 2;  player.style.left = (25 + lane * 100) + "px";}document.addEventListener("keydown", function(e) {  if (e.key === "ArrowLeft") move(-1);  if (e.key === "ArrowRight") move(1);});function startGame() {  clearInterval(timer);  clearInterval(lineTimer);  enemies.forEach(e => e.remove());  enemies = [];  lane = 1;  score = 0;  speed = 4;  running = true;  player.style.left = "125px";  scoreBox.innerText = score;  message.innerText = "🏁 Race शुरू!";  timer = setInterval(updateGame, 30);  lineTimer = setInterval(createEnemy, 1100);}function createEnemy() {  if (!running) return;  let enemy = document.createElement("div");  enemy.className = "enemy";  enemy.innerText = "🚙";  let enemyLane = Math.floor(Math.random() * 3);  enemy.style.left = (25 + enemyLane * 100) + "px";  game.appendChild(enemy);  enemies.push(enemy);}function updateGame() {  enemies.forEach((enemy, index) => {    let y = enemy.offsetTop + speed;    enemy.style.top = y + "px";    let playerY = player.offsetTop;    if (      y + 40 > playerY &&      y < playerY + 40 &&      enemy.style.left === player.style.left    ) {      endGame();    }    if (y > 450) {      enemy.remove();      enemies.splice(index, 1);      score++;      scoreBox.innerText = score;      if (score % 5 === 0) speed += 0.5;    }  });}function endGame() {  running = false;  clearInterval(timer);  clearInterval(lineTimer);  message.innerText = "💥 GAME OVER! Score: " + score;}</script></body></html>
