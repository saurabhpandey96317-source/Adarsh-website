
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Adarsh Police Chase</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center;overflow:hidden}
h2{margin:8px;font-size:21px}
#stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:5px;margin:7px;font-size:14px}
canvas{display:block;margin:auto;background:#333;width:min(300px,94vw);height:auto;max-height:65vh;border:3px solid white;border-radius:10px}
.controls{display:flex;justify-content:center;gap:12px;margin:9px}
button{border:0;border-radius:10px;padding:12px 20px;font-size:18px;font-weight:bold;background:#ffcc00;color:#111}
#nitro{background:#00c8ff}
#start{background:#35db65}
#msg{font-size:15px;min-height:20px}
</style>
</head>
<body>
<h2>🚓 ADARSH POLICE CHASE 🏎️</h2>
<div id="stats">
<span id="lives">❤️❤️❤️</span>
<span>Score: <b id="score">0</b></span>
<span>🪙 <b id="coins">0</b></span>
<span>🏆 <b id="high">0</b></span>
</div>

<canvas id="game" width="300" height="500"></canvas>
<div id="msg">Police se bachkar bhaago!</div>
<div class="controls">
<button onclick="move(-1)">⬅️ LEFT</button>
<button id="nitro" onclick="boost()">⚡ NITRO</button>
<button onclick="move(1)">RIGHT ➡️</button>
</div>
<button id="start" onclick="startGame()">▶ START GAME</button>
<div style="font-size:12px;margin:7px">Police se bacho aur coins collect karo!</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const lanes=[65,150,235];

let playerLane=1;
let policeLane=1;
let traffic=[];
let coinsList=[];
let score=0,coins=0,lives=3;
let running=false,frame=0;
let policeDistance=0;
let nitro=0;
let car="🏎️";
let high=Number(localStorage.getItem("adarshPoliceHigh")||0);

document.getElementById("high").textContent=high;

function updateUI(){
 document.getElementById("lives").textContent=
 "❤️".repeat(lives)+"🖤".repeat(3-lives);
 document.getElementById("score").textContent=score;
 document.getElementById("coins").textContent=coins;
 document.getElementById("high").textContent=high;
}

function road(){
 ctx.fillStyle="#28733a";
 ctx.fillRect(0,0,300,500);
 ctx.fillStyle="#444";
 ctx.fillRect(20,0,260,500);

 ctx.fillStyle="white";
 ctx.fillRect(20,0,5,500);
 ctx.fillRect(275,0,5,500);

 ctx.strokeStyle="#ddd";
 ctx.lineWidth=3;
 ctx.setLineDash([25,25]);
 ctx.lineDashOffset=-frame*4;
 ctx.beginPath();
 ctx.moveTo(106,0);ctx.lineTo(106,500);
 ctx.moveTo(194,0);ctx.lineTo(194,500);
 ctx.stroke();
 ctx.setLineDash([]);
}

function drawCar(x,y,emoji){
 ctx.font="35px Arial";
 ctx.textAlign="center";
 ctx.fillText(emoji,x,y);
}

function draw(){
 road();

 // Traffic cars
 traffic.forEach(t=>{
  drawCar(lanes[t.lane],t.y,t.emoji);
 });

 // Coins
 coinsList.forEach(o=>{
  ctx.font="23px Arial";
  ctx.textAlign="center";
  ctx.fillText("🪙",lanes[o.lane],o.y);
 });

 // Police behind player
 drawCar(lanes[policeLane],420,"🚓");

 // Player
 drawCar(lanes[playerLane],350,car);

 // Nitro effect
 if(nitro>0){
  ctx.fillStyle="#00dfff";
  ctx.font="15px Arial";
  ctx.fillText("⚡ NITRO!",150,470);
 }
}

function move(dir){
 if(!running)return;
 playerLane=Math.max(0,Math.min(2,playerLane+dir));
}

function boost(){
 if(running && nitro===0){
  nitro=100;
  document.getElementById("msg").textContent="⚡ NITRO BOOST!";
 }
}

function startGame(){
 playerLane=1;
 policeLane=1;
 traffic=[];
 coinsList=[];
 score=0;
 coins=0;
 lives=3;
 frame=0;
 policeDistance=0;
 nitro=0;
 running=true;
 document.getElementById("start").textContent="🔄 RESTART";
 document.getElementById("msg").textContent="Police tumhara peecha kar rahi hai!";
 updateUI();
 requestAnimationFrame(loop);
}

function gameOver(message){
 running=false;
 document.getElementById("msg").textContent=message+" Score: "+score;
 document.getElementById("start").textContent="▶ PLAY AGAIN";
}

function loop(){
 if(!running)return;
 frame++;

 let speed=nitro>0?5.5:3;
 if(nitro>0)nitro--;

 if(frame%65===0){
  traffic.push({
   lane:Math.floor(Math.random()*3),
   y:-30,
   emoji:["🚕","🚙","🚗"][Math.floor(Math.random()*3)]
  });
 }

 if(frame%100===0){
  coinsList.push({
   lane:Math.floor(Math.random()*3),
   y:-20
  });
 }

 traffic.forEach(t=>t.y+=speed);
 coinsList.forEach(o=>o.y+=speed);

 // Traffic collision
 traffic=traffic.filter(t=>{
  if(t.y>325 && t.y<380 && t.lane===playerLane){
   lives--;
   updateUI();
   document.getElementById("msg").textContent="💥 Traffic se takkar!";
   if(lives<=0){
    gameOver("GAME OVER!");
   }
   return false;
  }
  return t.y<530;
 });

 // Collect coins
 coinsList=coinsList.filter(o=>{
  if(o.y>325 && o.y<380 && o.lane===playerLane){
   coins++;
   score+=10;
   updateUI();
   return false;
  }
  return o.y<530;
 });

 // Police chase
 if(frame%45===0){
  policeLane=playerLane;
 }

 // Police gradually catches up
 policeDistance+=0.08;
 if(nitro>0)policeDistance-=0.8;
 if(policeDistance<0)policeDistance=0;

 if(policeDistance>100){
  gameOver("🚓 POLICE NE PAKAD LIYA!");
 }

 score++;
 if(score>high){
  high=score;
  localStorage.setItem("adarshPoliceHigh",high);
 }
 updateUI();

 draw();
 requestAnimationFrame(loop);
}

draw();
updateUI();

// Keyboard controls
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key===" " )boost();
});

// Mobile swipe
let touchX=0;
c.addEventListener("touchstart",e=>{
 touchX=e.touches[0].clientX;
},{passive:true});

c.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-touchX;
 if(Math.abs(dx)>25)move(dx>0?1:-1);
},{passive:true});
</script>
</body>
</html>
