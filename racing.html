
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Adarsh Car Racing 4.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 5px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h2 {
  color: #ffd43b;
  margin: 8px 0;
  font-size: 21px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  margin: 8px 0;
}

#cars button {
  background: #263449;
  color: white;
  border: 2px solid orange;
  padding: 7px 12px;
  font-size: 21px;
}

#cars button.selected {
  background: orange;
  color: black;
}

#gameCanvas {
  display: block;
  width: min(94vw, 380px);
  height: auto;
  aspect-ratio: 3 / 5;
  margin: 5px auto;
  border: 3px solid white;
  border-radius: 9px;
  background: #82cfff;
  touch-action: none;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  margin: 4px;
  font-size: 15px;
  font-weight: bold;
  background: orange;
  color: #111;
  touch-action: none;
}

.controls button {
  min-width: 90px;
  font-size: 19px;
}

#nitroBtn {
  background: #087ff5;
  color: white;
}

#soundBtn {
  background: #159447;
  color: white;
}

#message {
  color: #ffdf52;
  font-size: 15px;
  min-height: 20px;
  margin: 7px;
}

.small {
  color: #bdc9d8;
  font-size: 12px;
}
</style>
</head>

<body>

<h2>🏎️ ADARSH CAR RACING 4.0</h2>

<div class="stats">
  <span>🏆 Score: <b id="score">0</b></span>
  <span>🥇 Best: <b id="best">0</b></span>
  <span>❤️ Lives: <b id="lives">3</b></span>
  <span>⛽ Fuel: <b id="fuel">100</b>%</span>
  <span>🪙 Coins: <b id="coins">0</b></span>
</div>

<h3>🚘 Choose Your Car</h3>

<div id="cars">
  <button class="selected" onclick="chooseCar('🏎️',this)">🏎️</button>
  <button onclick="chooseCar('🚕',this)">🚕</button>
  <button onclick="chooseCar('🚓',this)">🚓</button>
  <button onclick="chooseCar('🚑',this)">🚑</button>
</div>

<canvas id="gameCanvas" width="360" height="600"></canvas>

<h3 id="message">अपनी कार चुनो और Race शुरू करो!</h3>

<div class="controls">
  <button onclick="move(-1)">⬅️ LEFT</button>
  <button onclick="move(1)">RIGHT ➡️</button>
</div>

<button onclick="startGame()">▶️ START / RESTART</button>
<button id="nitroBtn">⚡ NITRO</button>
<br>
<button id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button>

<p class="small">
  Coins लो • Fuel Can लो • दूसरी कारों से बचो!
</p>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreBox = document.getElementById("score");
const bestBox = document.getElementById("best");
const livesBox = document.getElementById("lives");
const fuelBox = document.getElementById("fuel");
const coinsBox = document.getElementById("coins");
const message = document.getElementById("message");

let running = false;
let lane = 0;
let car = "🏎️";

let score = 0;
let best = 0;
let lives = 3;
let fuel = 100;
let coins = 0;

let speed = 0.30;
let objects = [];
let spawnTimer = 0;
let roadOffset = 0;

let nitro = false;
let nitroTime = 0;
let soundOn = true;

let lastTime = 0;

try {
  best = Number(localStorage.getItem("adarshBest4")) || 0;
} catch(e) {}

bestBox.innerText = best;

// SOUND
let audio = null;

function beep(freq, duration, volume) {
  if (!soundOn) return;

  try {
    if (!audio) {
      const AudioClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioClass) return;
      audio = new AudioClass();
    }

    if (audio.state === "suspended") audio.resume();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    gain.gain.exponentialRampToValueAtTime(
      0.001, audio.currentTime + duration
    );

    osc.stop(audio.currentTime + duration);
  } catch(e) {}
}

function toggleSound() {
  soundOn = !soundOn;

  document.getElementById("soundBtn").innerText =
    soundOn ? "🔊 Sound ON" : "🔇 Sound OFF";

  if (soundOn) beep(500, 0.15, 0.08);
}

// CAR SELECT
function chooseCar(value, button) {
  if (running) {
    message.innerText = "पहले Race खत्म करो!";
    return;
  }

  car = value;

  document.querySelectorAll("#cars button")
    .forEach(b => b.classList.remove("selected"));

  button.classList.add("selected");
  draw();
}

// ROAD
function roadData(z) {
  const y = 165 + z * z * 435;
  const half = 28 + z * 145;

  return { y, half };
}

function drawRoad() {
  const sky = ctx.createLinearGradient(0, 0, 0, 200);
  sky.addColorStop(0, "#55b9ff");
  sky.addColorStop(1, "#d7f4ff");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 360, 600);

  // City
  for (let i = 0; i < 12; i++) {
    const x = i * 34;
    const h = 35 + (i * 17 % 55);

    ctx.fillStyle = "#65778c";
    ctx.fillRect(x, 165 - h, 25, h);

    ctx.fillStyle = "#ffe58a";
    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 5, 140 - j * 12, 4, 5);
      ctx.fillRect(x + 15, 140 - j * 12, 4, 5);
    }
  }

  // Grass
  ctx.fillStyle = "#3b9d45";
  ctx.fillRect(0, 165, 360, 435);

  // Road
  const top = roadData(0);
  const bottom = roadData(1);

  ctx.fillStyle = "#393d46";
  ctx.beginPath();
  ctx.moveTo(180 - top.half, top.y);
  ctx.lineTo(180 + top.half, top.y);
  ctx.lineTo(180 + bottom.half, bottom.y);
  ctx.lineTo(180 - bottom.half, bottom.y);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(180 - top.half, top.y);
  ctx.lineTo(180 - bottom.half, bottom.y);
  ctx.moveTo(180 + top.half, top.y);
  ctx.lineTo(180 + bottom.half, bottom.y);
  ctx.stroke();

  // Moving lane lines
  for (let z = 0; z < 1; z += 0.13) {
    let p = (z + roadOffset) % 1;
    let d = roadData(p);

    ctx.fillStyle = "white";
    ctx.fillRect(180 - d.half / 3, d.y, 3 + p * 3, 8 + p * 12);
    ctx.fillRect(180 + d.half / 3, d.y, 3 + p * 3, 8 + p * 12);
  }

  // Side buildings
  for (let i = 0; i < 7; i++) {
    let z = (i / 7 + roadOffset * 0.4) % 1;
    let d = roadData(z);
    let size = 12 + z * 25;

    ctx.fillStyle = i % 2 ? "#b7c4d1" : "#d6a77b";

    ctx.fillRect(180 - d.half - size - 8, d.y - size, size, size);
    ctx.fillRect(180 + d.half + 8, d.y - size, size, size);

    ctx.fillStyle = "#fff1a8";
    ctx.fillRect(180 - d.half - size, d.y - size + 8, 5, 6);
    ctx.fillRect(180 + d.half + 10, d.y - size + 8, 5, 6);
  }
}

// PLAYER CAR
function drawPlayer() {
  const x = 180 + lane * 75;
  const y = 510;

  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(x, y + 28, 34, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#e52d36";
  ctx.beginPath();
  ctx.moveTo(x - 23, y + 25);
  ctx.lineTo(x - 20, y - 12);
  ctx.lineTo(x - 12, y - 32);
  ctx.lineTo(x + 12, y - 32);
  ctx.lineTo(x + 20, y - 12);
  ctx.lineTo(x + 23, y + 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#9be5ff";
  ctx.fillRect(x - 13, y - 23, 26, 15);

  ctx.fillStyle = "#111";
  ctx.fillRect(x - 27, y - 8, 7, 17);
  ctx.fillRect(x + 20, y - 8, 7, 17);
  ctx.fillRect(x - 27, y + 14, 7, 14);
  ctx.fillRect(x + 20, y + 14, 7, 14);

  ctx.fillStyle = "#fff7a3";
  ctx.fillRect(x - 18, y + 17, 7, 5);
  ctx.fillRect(x + 11, y + 17, 7, 5);

  if (nitro) {
    ctx.fillStyle = "#36d8ff";
    ctx.beginPath();
    ctx.moveTo(x - 10, y + 26);
    ctx.lineTo(x, y + 60);
    ctx.lineTo(x + 10, y + 26);
    ctx.fill();
  }

  // Selected car emoji
  ctx.font = "25px Arial";
  ctx.textAlign = "center";
  ctx.fillText(car, x, y - 40);
}

// OBJECTS
function drawObjects() {
  objects.forEach(obj => {
    const d = roadData(obj.z);
    const x = 180 + obj.lane * d.half * 0.55;
    const size = 12 + obj.z * 35;

    ctx.font = size + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let emoji = "🚙";
    if (obj.type === "coin") emoji = "🪙";
    if (obj.type === "fuel") emoji = "⛽";

    ctx.fillText(emoji, x, d.y);
  });
}

// DRAW
function draw() {
  drawRoad();
  drawObjects();
  drawPlayer();

  if (!running) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, 360, 600);

    ctx.fillStyle = "white";
    ctx.font = "bold 22px Arial";
    ctx.textAlign = "center";
    ctx.fillText("ADARSH RACING", 180, 280);
  }
}

// MOVE
function move(direction) {
  if (!running) return;

  lane += direction;
  lane = Math.max(-1, Math.min(1, lane));

  beep(320, 0.07, 0.04);
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
});

// START
function startGame() {
  score = 0;
  lives = 3;
  fuel = 100;
  coins = 0;
  speed = 0.30;
  lane = 0;

  objects = [];
  spawnTimer = 0;
  roadOffset = 0;
  nitro = false;
  nitroTime = 0;

  running = true;
  lastTime = 0;

  scoreBox.innerText = score;
  livesBox.innerText = lives;
  fuelBox.innerText = fuel;
  coinsBox.innerText = coins;

  message.innerText = "🏁 Race शुरू!";

  beep(600, 0.2, 0.08);
  requestAnimationFrame(gameLoop);
}

// SPAWN
function spawnObject() {
  const chance = Math.random();
  let type = "car";

  if (chance < 0.25) type = "coin";
  else if (chance < 0.38) type = "fuel";

  objects.push({
    lane: Math.floor(Math.random() * 3) - 1,
    z: 0,
    type: type
  });
}

// NITRO
const nitroBtn = document.getElementById("nitroBtn");

nitroBtn.addEventListener("pointerdown", e => {
  e.preventDefault();

  if (!running || nitro) return;

  nitro = true;
  nitroTime = 0;
  beep(850, 0.3, 0.1);
});

function stopNitro() {
  nitro = false;
}

nitroBtn.addEventListener("pointerup", stopNitro);
nitroBtn.addEventListener("pointerleave", stopNitro);
nitroBtn.addEventListener("pointercancel", stopNitro);

// GAME LOOP
function gameLoop(time) {
  if (!running) return;

  if (!lastTime) lastTime = time;

  let dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  let currentSpeed = speed;

  if (nitro) {
    currentSpeed *= 1.8;
    nitroTime += dt;

    if (nitroTime > 3) nitro = false;
  }

  roadOffset += currentSpeed * dt * 1.5;
  roadOffset %= 1;

  fuel -= dt * 1.5;

  if (fuel <= 0) {
    fuel = 0;
    endGame("⛽ पेट्रोल खत्म!");
    return;
  }

  spawnTimer += dt;

  if (spawnTimer > 1.25) {
    spawnObject();
    spawnTimer = 0;
  }

  for (let i = objects.length - 1; i >= 0; i--) {
    let obj = objects[i];

    obj.z += currentSpeed * dt;

    if (obj.z > 0.88 && obj.lane === lane) {
      if (obj.type === "coin") {
        coins++;
        coinsBox.innerText = coins;
        score += 5;
        beep(750, 0.12, 0.07);
        objects.splice(i, 1);
        continue;
      }

      if (obj.type === "fuel") {
        fuel = Math.min(100, fuel + 30);
        fuelBox.innerText = Math.floor(fuel);
        beep(500, 0.2, 0.08);
        objects.splice(i, 1);
        continue;
      }

      if (obj.type === "car") {
        lives--;
        livesBox.innerText = lives;
        beep(100, 0.4, 0.12);
        objects.splice(i, 1);

        if (lives <= 0) {
          endGame("💥 तीनों Lives खत्म!");
          return;
        }

        message.innerText = "💥 टक्कर! " + lives + " Lives बची हैं";
        continue;
      }
    }

    if (obj.z > 1.08) {
      objects.splice(i, 1);
    }
  }

  score += dt * 2;
  scoreBox.innerText = Math.floor(score);

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    bestBox.innerText = best;

    try {
      localStorage.setItem("adarshBest4", best);
    } catch(e) {}
  }

  if (Math.floor(score) > 0 && Math.floor(score) % 20 === 0) {
    speed = Math.min(0.65, speed + dt * 0.005);
  }

  fuelBox.innerText = Math.floor(fuel);

  draw();
  requestAnimationFrame(gameLoop);
}

// GAME OVER
function endGame(text) {
  running = false;
  nitro = false;
  message.innerText = text + " Score: " + Math.floor(score);
  draw();
}

// INITIAL SCREEN
draw();
</script>

</body>
</html>
