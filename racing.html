<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adarsh Car Racing 4.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101827;color:white;
  font-family:Arial,sans-serif;text-align:center;
  overflow-x:hidden;padding:8px 8px 18px;
}
h1{font-size:clamp(21px,5vw,30px);color:#ffd43b;margin:8px 0}
.stats{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:7px 13px;font-size:clamp(13px,3.5vw,17px);
  margin:10px auto 12px;max-width:520px;
}
.stat{white-space:nowrap}
h2{font-size:19px;margin:12px 0 9px}
.cars{display:flex;justify-content:center;gap:8px;margin:8px auto 12px}
.car{
  width:62px;height:48px;border:3px solid orange;border-radius:13px;
  background:#202c3e;color:white;font-size:25px;
}
.car.selected{background:orange}
#gameCanvas{
  display:block;
  width:min(252px,94vw);
  height:auto;
  aspect-ratio:3/5;
  margin:0 auto;
  border:4px solid white;border-radius:13px;
  background:#477fa0;
  touch-action:none;
}
#message{min-height:22px;margin:7px 0;font-size:14px;color:#ffe082}
.controls{
  display:flex;justify-content:center;gap:12px;
  margin:8px auto;max-width:330px;
}
.control{
  width:90px;height:48px;border:0;border-radius:12px;
  background:#26374f;color:white;font-size:25px;
  touch-action:none;
}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px auto}
.action{
  border:0;border-radius:12px;padding:12px 18px;
  background:#ffb000;color:#171717;font-weight:bold;font-size:15px;
}
#nitroBtn{background:#00bde8}
#soundBtn{background:#4b607c;color:white}
.small{font-size:12px;color:#b9c5d5;margin:8px}
</style>
</head>
<body>

<h1>🏎️ ADARSH CAR RACING 4.0</h1>

<div class="stats">
  <div class="stat">🏆 Score: <b id="score">0</b></div>
  <div class="stat">🥇 Best: <b id="best">0</b></div>
  <div class="stat">❤️ Lives: <b id="lives">3</b></div>
  <div class="stat">⛽ Fuel: <b id="fuel">100</b>%</div>
  <div class="stat">🪙 Coins: <b id="coins">0</b></div>
</div>

<h2>🚘 Choose Your Car</h2>
<div class="cars">
  <button class="car selected" data-car="🏎️">🏎️</button>
  <button class="car" data-car="🚕">🚕</button>
  <button class="car" data-car="🚓">🚓</button>
  <button class="car" data-car="🚑">🚑</button>
</div>

<canvas id="gameCanvas" width="360" height="600"></canvas>
<div id="message">Start dabao aur race shuru karo!</div>

<div class="controls">
  <button class="control" id="leftBtn">⬅️</button>
  <button class="control" id="rightBtn">➡️</button>
</div>

<div class="actions">
  <button class="action" id="startBtn">▶ START</button>
  <button class="action" id="nitroBtn">⚡ NITRO</button>
  <button class="action" id="soundBtn">🔊 SOUND ON</button>
</div>
<div class="small">Road par gaadi bachao, coins aur fuel collect karo!</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);
let score=0,coins=0,lives=3,fuel=100,best=0;
let lane=0,selectedCar="🏎️";
let running=false,gameOver=false,nitro=0;
let roadMove=0,spawnTimer=0,lastTime=0;
let objects=[];
let soundOn=true,audio=null;
let crashFlash=0;

try{best=Number(localStorage.getItem("adarshRaceBest")||0)}catch(e){}
$("best").textContent=best;

function sound(freq=440,duration=.1,type="sine",volume=.07){
  if(!soundOn)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}
function updateUI(){
  $("score").textContent=Math.floor(score);
  $("best").textContent=best;
  $("lives").textContent=lives;
  $("fuel").textContent=Math.max(0,Math.floor(fuel));
  $("coins").textContent=coins;
}
function road(y){
  const z=y/600;
  const half=35+z*145;
  return {left:180-half,right:180+half,half};
}
function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,340);
  sky.addColorStop(0,"#367ba4");sky.addColorStop(1,"#a8c8d2");
  ctx.fillStyle=sky;ctx.fillRect(0,0,360,600);

  // City buildings
  for(let i=0;i<11;i++){
    const x=i*37-8;
    const h=75+(i*47%95);
    ctx.fillStyle=i%2?"#405264":"#344354";
    ctx.fillRect(x,340-h,25,h);
    ctx.fillStyle="#d9c779";
    for(let wy=350-h+12;wy<330;wy+=20){
      ctx.fillRect(x+5,wy,5,8);
      ctx.fillRect(x+16,wy,5,8);
    }
  }
  ctx.fillStyle="#22602e";ctx.fillRect(0,340,360,260);

  // Road
  const top=road(340),bottom=road(600);
  ctx.fillStyle="#24272e";
  ctx.beginPath();
  ctx.moveTo(top.left,340);ctx.lineTo(top.right,340);
  ctx.lineTo(bottom.right,600);ctx.lineTo(bottom.left,600);
  ctx.closePath();ctx.fill();

  ctx.strokeStyle="#bfc3c5";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(top.left,340);ctx.lineTo(bottom.left,600);
  ctx.moveTo(top.right,340);ctx.lineTo(bottom.right,600);
  ctx.stroke();

  // Road lane markings
  ctx.fillStyle="#eeeeee";
  for(let i=0;i<9;i++){
    let y=((i*85+roadMove)%300)+330;
    let r=road(y);
    let size=3+(y/600)*5;
    for(let k=1;k<=2;k++){
      let x=r.left+(r.half*2*k/3);
      ctx.fillRect(x-size/2,y,size,10+y/30);
    }
  }
}
function drawObjects(){
  for(const o of objects){
    const r=road(o.y);
    const x=180+o.lane*r.half*.58;
    ctx.font="30px Arial";ctx.textAlign="center";
    ctx.fillText(o.type==="coin"?"🪙":o.type==="fuel"?"⛽":"🚙",x,o.y);
  }
}
function drawPlayer(){
  const r=road(575);
  const x=180+lane*r.half*.58;
  ctx.textAlign="center";ctx.font="42px Arial";
  ctx.fillText(selectedCar,x,578);
  if(nitro>0){
    ctx.font="22px Arial";ctx.fillText("🔥",x,598);
  }
}
function draw(){
  drawBackground();
  drawObjects();
  drawPlayer();

  if(crashFlash>0){
    ctx.fillStyle="rgba(255,0,0,.22)";
    ctx.fillRect(0,0,360,600);
  }
  if(!running){
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(0,0,360,600);
    ctx.fillStyle="white";ctx.textAlign="center";
    ctx.font="bold 25px Arial";
    ctx.fillText(gameOver?"GAME OVER":"ADARSH RACING",180,290);
    ctx.font="16px Arial";
    ctx.fillText(gameOver?"Start dabakar phir khelo":"START BUTTON DABAO",180,325);
  }
}
function spawn(){
  const roll=Math.random();
  const type=roll<.55?"obstacle":roll<.8?"coin":"fuel";
  objects.push({lane:Math.floor(Math.random()*3)-1,y:340,type});
}
function hit(){
  lives--;
  crashFlash=12;
  sound(100,.35,"sawtooth",.13);
  $("message").textContent="💥 Crash! Ek life kam hui.";
  if(lives<=0)endGame();
  updateUI();
}
function endGame(){
  running=false;gameOver=true;
  $("message").textContent="🏁 Game Over! Score: "+Math.floor(score);
  sound(180,.5,"triangle");
}
function startGame(){
  score=0;coins=0;lives=3;fuel=100;lane=0;
  nitro=0;objects=[];spawnTimer=0;
  running=true;gameOver=false;lastTime=0;
  $("message").textContent="Race shuru! Gaadi bachao!";
  updateUI();sound(600,.15);
  requestAnimationFrame(loop);
}
function loop(time){
  if(!running)return;
  if(!lastTime)lastTime=time;
  let dt=Math.min((time-lastTime)/16.67,2);
  lastTime=time;

  const speed=nitro>0?5.5:3;
  roadMove=(roadMove+speed*dt)%300;
  score+=.12*dt*(nitro>0?2:1);
  fuel-=.018*dt*(nitro>0?2.3:1);
  if(nitro>0)nitro=Math.max(0,nitro-dt);
  if(crashFlash>0)crashFlash-=dt;

  spawnTimer+=dt;
  if(spawnTimer>48){spawn();spawnTimer=0}

  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.y+=speed*dt*(o.type==="coin"?.95:1);
    if(o.y>535&&o.y<590&&o.lane===lane){
      if(o.type==="obstacle")hit();
      if(o.type==="coin"){coins++;score+=10;sound(850,.08,"sine");}
      if(o.type==="fuel"){fuel=Math.min(100,fuel+22);sound(500,.12);}
      objects.splice(i,1);
      continue;
    }
    if(o.y>620)objects.splice(i,1);
  }

  if(score>best){
    best=Math.floor(score);
    try{localStorage.setItem("adarshRaceBest",best)}catch(e){}
  }
  if(fuel<=0){fuel=0;endGame()}
  updateUI();draw();
  if(running)requestAnimationFrame(loop);
}

function move(dir){
  if(!running)return;
  lane=Math.max(-1,Math.min(1,lane+dir));
  sound(300,.05,"square",.025);
}
$("leftBtn").addEventListener("pointerdown",e=>{e.preventDefault();move(-1)});
$("rightBtn").addEventListener("pointerdown",e=>{e.preventDefault();move(1)});
$("startBtn").addEventListener("click",startGame);
$("nitroBtn").addEventListener("click",()=>{
  if(running&&fuel>5){nitro=100;fuel-=5;sound(950,.2,"sawtooth");}
});
$("soundBtn").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
  if(soundOn)sound(500,.1);
});
document.querySelectorAll(".car").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(running)return;
    document.querySelectorAll(".car").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedCar=btn.dataset.car;
    draw();
  });
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key===" "&& !running)startGame();
});
draw();updateUI();
</script>
</body>
</html>
