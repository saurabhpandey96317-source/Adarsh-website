
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess The Number</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: linear-gradient(135deg,#101827,#2563eb);
  font-family: Arial;
  text-align: center;
  color: white;
}

.game {
  max-width: 350px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  color: #222;
  border-radius: 20px;
  box-shadow: 0 5px 20px #0005;
}

h1 { color: #ffd43b; }
h2 { color: #2563eb; }

input {
  width: 80%;
  padding: 12px;
  font-size: 18px;
  border: 2px solid #2563eb;
  border-radius: 10px;
  text-align: center;
}

button {
  padding: 12px 18px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

button:hover {
  background: #1746a2;
}

#message {
  font-weight: bold;
  min-height: 25px;
}

.home {
  background: #15803d;
}

.animate {
  animation: restart 0.5s ease;
}

@keyframes restart {
  50% { transform: rotate(3deg) scale(1.04); }
  100% { transform: rotate(0) scale(1); }
}
</style>
</head>

<body>

<h1>🎮 Adarsh Games</h1>

<button class="home" onclick="location.href='index.html'">
🏠 Home
</button>

<div class="game" id="game">

<h2>🔢 Guess The Number</h2>
<p>1 से 100 के बीच नंबर Guess करो!</p>

<input type="number" id="guess" placeholder="Enter Number">

<br>

<button onclick="checkGuess()">Check</button>
<button onclick="restartGame()">New Game</button>

<h3 id="message">चलो गेम शुरू करो!</h3>

<p>Attempts: <span id="attempts">0</span></p>
<p>Score: <span id="score">0</span></p>
<p>🏆 Best Score: <span id="best">0</span></p>

</div>

<script>
let secret = Math.floor(Math.random() * 100) + 1;
let attempts = 0;
let score = 0;
let gameOver = false;

let best = Number(localStorage.getItem("bestScore")) || 0;

document.getElementById("best").innerText = best;

function playSound(frequency) {
  try {
    let audio = new AudioContext();
    let oscillator = audio.createOscillator();
    let gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = frequency;
    oscillator.start();

    gain.gain.setValueAtTime(0.2, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audio.currentTime + 0.3
    );

    oscillator.stop(audio.currentTime + 0.3);
  } catch(e) {}
}

function checkGuess() {
  if (gameOver) return;

  let value = Number(document.getElementById("guess").value);
  let message = document.getElementById("message");

  if (value < 1 || value > 100 || !Number.isInteger(value)) {
    message.innerText = "1 से 100 के बीच नंबर डालो!";
    return;
  }

  attempts++;
  document.getElementById("attempts").innerText = attempts;

  if (value === secret) {
    score = Math.max(0, 100 - (attempts - 1) * 10);
    document.getElementById("score").innerText = score;

    message.innerText = "🎉 सही जवाब! तुम जीत गए!";
    playSound(800);
    gameOver = true;

    if (best === 0 || score > best) {
      best = score;
      localStorage.setItem("bestScore", best);
      document.getElementById("best").innerText = best;
    }

  } else if (value < secret) {
    message.innerText = "⬆️ थोड़ा बड़ा नंबर डालो!";
    playSound(300);
  } else {
    message.innerText = "⬇️ थोड़ा छोटा नंबर डालो!";
    playSound(300);
  }

  document.getElementById("guess").value = "";
}

function restartGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  score = 0;
  gameOver = false;

  document.getElementById("attempts").innerText = 0;
  document.getElementById("score").innerText = 0;
  document.getElementById("guess").value = "";
  document.getElementById("message").innerText = "नई गेम शुरू!";
  
  let card = document.getElementById("game");
  card.classList.remove("animate");
  void card.offsetWidth;
  card.classList.add("animate");
}
</script>

</body>
</html>
